[project]
name = "fraude"
version = "0.1.0"
description = "Detección de fraude con desbalance extremo sobre IEEE-CIS, llevada a producción (caso 3 del portafolio de banca)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sergio Tous" }]
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "numpy",
    "altair",
    "vl-convert-python",
    "splink>=4",
    "scikit-learn>=1.9.1",
    # XGBoost: con CUDA en Windows (RTX 4080 local); solo CPU en Linux (CI), mismo módulo.
    "xgboost>=3; sys_platform == 'win32'",
    "xgboost-cpu>=3; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraude"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: pruebas del flujo completo (más lentas)",
]
